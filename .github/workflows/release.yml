name: Build and Release MonBudget

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Create .env file
        shell: pwsh
        run: |
          $envContent = "RENDERER_VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}`nRENDERER_VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          Set-Content -Path ".env" -Value $envContent -Encoding UTF8

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
