name: Build and Release MonBudget

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate public Supabase configuration
        run: >
          node --env-file=.env -e "if (process.env.RENDERER_VITE_SUPABASE_URL !== 'https://kqzpxgrgydrdbscfkemy.supabase.co' ||
          !/^sb_publishable_[A-Za-z0-9_-]+$/.test(process.env.RENDERER_VITE_SUPABASE_ANON_KEY || ''))
          throw new Error('Invalid public Supabase configuration')"

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package Windows
        run: npx electron-builder --win --publish never

      - name: Publish Windows release
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          $installer = "dist/monbudget-$version-setup.exe"
          gh release create $env:GITHUB_REF_NAME $installer "$installer.blockmap" dist/latest.yml --verify-tag --title "MonBudget $version" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
